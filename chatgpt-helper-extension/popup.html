<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ChatGPT Reading Toolkit</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #18201c;
        --muted: #66716b;
        --line: #d8dfdb;
        --paper: #f7f9f8;
        --panel: #ffffff;
        --accent: #2f6f57;
        --accent-soft: #e0eee7;
      }
      * { box-sizing: border-box; }
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        color: var(--ink);
        background: var(--paper);
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      h1 { margin: 0; font-size: 17px; font-weight: 750; letter-spacing: 0; }
      .version { color: var(--muted); font: 11px Consolas, monospace; }
      section {
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      section:first-of-type { border-top: 0; }
      h2 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        min-height: 34px;
      }
      .row + .row { margin-top: 7px; }
      label { font-size: 13px; line-height: 1.35; }
      select {
        width: 132px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        background: var(--panel);
        font: 12px inherit;
      }
      .range-wrap {
        display: grid;
        grid-template-columns: 94px 38px;
        gap: 8px;
        align-items: center;
      }
      input[type="range"] { width: 94px; accent-color: var(--accent); }
      output { color: var(--muted); text-align: right; font: 11px Consolas, monospace; }
      .switch { position: relative; width: 34px; height: 20px; }
      .switch input { position: absolute; opacity: 0; pointer-events: none; }
      .switch span {
        display: block;
        width: 34px;
        height: 20px;
        border: 1px solid #aeb8b2;
        border-radius: 10px;
        background: #cbd2ce;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease;
      }
      .switch span::after {
        content: "";
        display: block;
        width: 14px;
        height: 14px;
        margin: 2px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
        transition: transform 140ms ease;
      }
      .switch input:checked + span { border-color: var(--accent); background: var(--accent); }
      .switch input:checked + span::after { transform: translateX(14px); }
      .switch input:focus-visible + span, select:focus-visible, input[type="range"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      footer { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding-top: 10px; }
      #status { min-height: 16px; color: var(--accent); font-size: 12px; }
      button {
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        color: white;
        background: var(--accent);
        font: 600 13px inherit;
        cursor: pointer;
      }
      button:hover { filter: brightness(.93); }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e5ebe7;
          --muted: #99a49e;
          --line: #39423d;
          --paper: #171b19;
          --panel: #202622;
          --accent: #71a98e;
          --accent-soft: #253c32;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ChatGPT 工具箱</h1>
      <span class="version">v2.0</span>
    </header>

    <section>
      <h2>公式</h2>
      <div class="row">
        <label for="copyMode">默认复制格式</label>
        <select id="copyMode">
          <option value="latex">LaTeX</option>
          <option value="markdown">Markdown</option>
          <option value="word">MathML / Word</option>
        </select>
      </div>
    </section>

    <section>
      <h2>阅读</h2>
      <div class="row">
        <label for="readingEnabled">自定义排版</label>
        <label class="switch"><input id="readingEnabled" type="checkbox" /><span></span></label>
      </div>
      <div class="row">
        <label for="readingWidth">正文宽度</label>
        <div class="range-wrap"><input id="readingWidth" type="range" min="640" max="1200" step="20" /><output data-for="readingWidth"></output></div>
      </div>
      <div class="row">
        <label for="fontScale">字体大小</label>
        <div class="range-wrap"><input id="fontScale" type="range" min="85" max="130" step="5" /><output data-for="fontScale"></output></div>
      </div>
      <div class="row">
        <label for="lineHeight">行高</label>
        <div class="range-wrap"><input id="lineHeight" type="range" min="1.35" max="2.1" step="0.05" /><output data-for="lineHeight"></output></div>
      </div>
      <div class="row">
        <label for="paragraphSpacing">段落间距</label>
        <div class="range-wrap"><input id="paragraphSpacing" type="range" min="0.2" max="1.6" step="0.1" /><output data-for="paragraphSpacing"></output></div>
      </div>
    </section>

    <section>
      <h2>效率</h2>
      <div class="row"><label for="draftSaveEnabled">草稿自动保存</label><label class="switch"><input id="draftSaveEnabled" type="checkbox" /><span></span></label></div>
      <div class="row"><label for="notificationsEnabled">回答完成通知</label><label class="switch"><input id="notificationsEnabled" type="checkbox" /><span></span></label></div>
      <div class="row"><label for="shortcutsEnabled">时间线快捷键</label><label class="switch"><input id="shortcutsEnabled" type="checkbox" /><span></span></label></div>
    </section>

    <footer>
      <div id="status" role="status"></div>
      <button id="saveBtn" type="button">保存</button>
    </footer>

    <script src="toolkit-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
